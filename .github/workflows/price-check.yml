name: Tour price monitor

on:
  schedule:
    # GitHub may delay scheduled jobs; 15 minutes is a sensible rate for this API.
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Required only to save the latest observed price in data/last_tour.json.
permissions:
  contents: write

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: python -m pip install -r requirements.txt

      - name: Install Chromium for Coral Travel
        run: python -m playwright install --with-deps chromium

      - name: Check the price and notify Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python check_once.py

      - name: Save the latest observed tour
        run: |
          if git diff --quiet -- data/last_tour.json; then
            echo "The saved tour has not changed."
          else
            git config user.name "tourhunter-bot"
            git config user.email "tourhunter-bot@users.noreply.github.com"
            git add data/last_tour.json
            git commit -m "chore: save latest tour price"
            git push
          fi
